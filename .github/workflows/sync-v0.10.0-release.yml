# Keep the published v0.10.0 GitHub Release body in sync with the reviewed
# post-publication notes. Creating this workflow on main triggers its first sync.
name: Sync v0.10.0 release description

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-v0.10.0-release.yml'
      - 'docs/releases/v0.10.0.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'hffgzktbcc-blip/ounce-core'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed documentation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Confirm existing release is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.10.0 --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft \
            --jq '.tagName == "v0.10.0" and .isDraft == false' | grep -qx true

      - name: Resolve relative documentation links for the GitHub release page
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import posixpath
          import re
          from pathlib import Path

          source = Path('docs/releases/v0.10.0.md')
          body = source.read_text(encoding='utf-8')
          if re.search(r'(?mi)^# .*\b(draft|not published)\b|^\*\*Status:.*\b(release prep|draft|not yet)\b|^## Before tagging\b', body):
              raise SystemExit('Refusing to publish draft/pre-tag release notes')

          def full_link(match):
              label, link = match.group(1), match.group(2)
              if link.startswith(('https://', 'http://', '#', 'mailto:', '/')):
                  return match.group(0)
              path, marker, fragment = link.partition('#')
              target = posixpath.normpath(posixpath.join('docs/releases', path))
              if target.startswith('../') or not Path(target).is_file():
                  raise SystemExit(f'Invalid relative release-note link: {link}')
              url = f'https://github.com/hffgzktbcc-blip/ounce-core/blob/v0.10.0/{target}'
              if marker:
                  url += '#' + fragment
              return f'[{label}]({url})'

          body = re.sub(r'\[([^\]\n]+)\]\(([^)\s]+)\)', full_link, body)
          rendered = Path(os.environ['RUNNER_TEMP']) / 'ounce-core-v0.10.0-release.md'
          rendered.write_text(body, encoding='utf-8')
          print(f'Prepared {rendered} ({len(body)} characters)')
          PY

      - name: Correct the published release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.10.0 --repo "$GITHUB_REPOSITORY" \
            --notes-file "$RUNNER_TEMP/ounce-core-v0.10.0-release.md"

      - name: Verify corrected title and status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.10.0 --repo "$GITHUB_REPOSITORY" \
            --json body,isDraft \
            --jq '.isDraft == false and (.body | startswith("# ounce-core v0.10.0 — release notes (published 2026-11-20)"))' \
            | grep -qx true
