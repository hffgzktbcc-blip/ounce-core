name: FP edge-case experiment

# Issue #359. Runs one fixed floating-point edge-case corpus on real AArch64 hardware (Linux Arm runner and Apple
# Silicon) and replays the same hardware results through the interpreter, Tier-3 and Tier-4. The raw hardware trace,
# per-case results for every engine, and a summary are uploaded as artifacts. See docs/verify/fp-edge/README.md.
# The fp-workload job (#485) runs the whole-program FP workload from docs/verify/fp-workload the same way.

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/verify/fp-edge/**'
      - 'docs/verify/fp-workload/**'
      - 'src/linux/**'
      - 'tools/testfloat/**'
      - 'docs/verify/insn-fuzzer/fuzz_host.c'
      - 'src/fuzz_replay.rs'
      - 'src/cpu/**'
      - 'crates/ounce-recompiler/**'
      - '.github/workflows/fp-edge.yml'
  workflow_dispatch:

concurrency:
  group: fp-edge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fp-edge:
    name: FP edge cases (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev
      - name: Build ounce-core with Tier-4
        run: cargo build --release --locked --features native-jit
      - name: Run the corpus on hardware and replay it through every engine
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in arm64|aarch64) ;; *) echo "not an AArch64 runner" >&2; exit 2 ;; esac
          bash docs/verify/fp-edge/run.sh "$RUNNER_TEMP/fp-edge-${{ matrix.os }}"
      - name: Job summary
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/fp-edge-${{ matrix.os }}/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fp-edge-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/fp-edge-${{ matrix.os }}/
          if-no-files-found: warn

  # Issue #485: docs/verify/fp-workload (#359) builds one C source natively, as the reference, and as a static ELF for
  # `run-elf`, then compares every op x 8 FPCR modes byte for byte (value and FPSR) on Tier-3 and Tier-4. The 48 ops in
  # gated-ops.txt must be identical on both tiers (UNSUPPORTED fails too, which run.sh itself lets pass). The ops added
  # by #488 are reported, not gated: UNSUPPORTED and MISMATCH are results, but an op that fails to run (OTHER-FAIL)
  # fails the job. A negative control then re-runs one op with an edited reference and requires MISMATCH, so a comparison that
  # stopped comparing would turn the job red. Limits: this runner is Linux on an Arm Neoverse core, not Apple silicon
  # (the README's results are from an Apple M3), and it is the project's own CI, not an independent reproduction (#248).
  fp-workload:
    name: FP workload, native vs run-elf (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install system dependencies and the C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev clang lld
      - name: Run the workload (native reference, Tier-3, Tier-4)
        shell: bash
        run: |
          # run.sh exits 1 on a MISMATCH, which the next step judges per op (#488: new ops may legitimately mismatch).
          # Any other non-zero status is a harness failure.
          rc=0
          bash docs/verify/fp-workload/run.sh "$RUNNER_TEMP/fp-workload" || rc=$?
          [ "$rc" -le 1 ] || exit "$rc"
      - name: Gated ops identical on both tiers, no op fails to run
        shell: bash
        run: |
          set -euo pipefail
          sum="$RUNNER_TEMP/fp-workload/summary.tsv"
          gated=docs/verify/fp-workload/gated-ops.txt   # the 48 ops of #359/#485: any verdict but identical fails the job
          echo "$(tail -n +2 "$sum" | grep -c .) ops compared, $(grep -c . "$gated") gated"
          missing=$(awk -F'\t' 'NR == FNR { seen[$1] = 1; next } !($1 in seen) { print }' "$sum" "$gated")
          if [ -n "$missing" ]; then printf 'Gated ops missing from the summary:\n%s\n' "$missing"; exit 1; fi
          bad=$(awk -F'\t' 'NR == FNR { g[$1] = 1; next } ($1 in g) && ($3 != "identical" || $4 != "identical")' "$gated" "$sum")
          if [ -n "$bad" ]; then printf 'Gated ops not identical on both tiers:\n%s\n' "$bad"; exit 1; fi
          # The ops added by #488 are reported, not gated: UNSUPPORTED and MISMATCH are results. OTHER-FAIL is not.
          other=$(awk -F'\t' '$3 ~ /OTHER-FAIL/ || $4 ~ /OTHER-FAIL/' "$sum")
          if [ -n "$other" ]; then printf 'Ops that failed to run:\n%s\n' "$other"; exit 1; fi
          echo "Ops outside the gated list (verdict per tier):"
          awk -F'\t' 'NR == FNR { g[$1] = 1; next } FNR > 1 && !($1 in g) && ($3 != "identical" || $4 != "identical") { print "  " $1, $3, $4 }' "$gated" "$sum"
      - name: Negative control (an edited reference must be flagged)
        shell: bash
        run: |
          set -euo pipefail
          neg="$RUNNER_TEMP/fp-workload-negative"
          if FP_WORKLOAD_OPS=fadd.d FP_WORKLOAD_TAMPER=fadd.d bash docs/verify/fp-workload/run.sh "$neg"; then
            echo "run.sh passed with a tampered reference"; exit 1
          fi
          verdicts=$(awk -F'\t' '$1 == "fadd.d" { print $3, $4 }' "$neg/summary.tsv")
          if [ "$verdicts" != "MISMATCH MISMATCH" ]; then echo "expected MISMATCH on both tiers, got: $verdicts"; exit 1; fi
          echo "tampered fadd.d reference flagged on both tiers"
      - name: Job summary
        if: always()
        shell: bash
        run: |
          { echo '### FP workload: native ARM64 vs run-elf'; echo; echo '```'
            column -t -s "$(printf '\t')" "$RUNNER_TEMP/fp-workload/summary.tsv" 2>/dev/null || cat "$RUNNER_TEMP/fp-workload/summary.tsv"
            echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fp-workload-evidence
          path: |
            ${{ runner.temp }}/fp-workload/summary.tsv
            ${{ runner.temp }}/fp-workload/SHA256SUMS
            ${{ runner.temp }}/fp-workload/toolchain.txt
            ${{ runner.temp }}/fp-workload-negative/summary.tsv
          if-no-files-found: warn

  # Berkeley TestFloat (SoftFloat 3e) as an independent software oracle for results and FPSR flags: add sub mul div sqrt
  # mulAdd, FCVT, SCVTF/UCVTF, FCVT*S/U, FRINT*, FCMP/FCMPE, in all four rounding modes. Tier-4 is not replayed here
  # (it runs through the interpreter once FPSR flags are tracked, see docs/verify/fp-edge/README.md). TestFloat is built
  # at pinned commits at test time; nothing from it is committed.
  testfloat:
    name: TestFloat oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev
      - name: Build ounce-core
        run: cargo build --release --locked
      - name: Build TestFloat at pinned commits
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/tf" && cd "$RUNNER_TEMP/tf"
          git clone -q https://github.com/ucb-bar/berkeley-softfloat-3.git && git -C berkeley-softfloat-3 checkout -q 07ebd29db0cfb55723a79fbbffe99103ef38e305
          git clone -q https://github.com/ucb-bar/berkeley-testfloat-3.git && git -C berkeley-testfloat-3 checkout -q a9c849f1b0eb0264b626d9686ffae167d996e3be
          make -C berkeley-softfloat-3/build/Linux-x86_64-GCC -j"$(nproc)" > sf.log 2>&1 || { tail -30 sf.log; exit 1; }
          make -C berkeley-testfloat-3/build/Linux-x86_64-GCC -j"$(nproc)" testfloat_gen > tf.log 2>&1 || { tail -30 tf.log; exit 1; }
          echo "TESTFLOAT_GEN=$PWD/berkeley-testfloat-3/build/Linux-x86_64-GCC/testfloat_gen" >> "$GITHUB_ENV"
      - name: Replay TestFloat vectors through the interpreter and Tier-3
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/testfloat.trace"
          python3 tools/testfloat/gen_trace.py --gen "$TESTFLOAT_GEN" --count 3000 > "$trace"
          wc -l "$trace"
          for engine in interp tier3; do
            echo "== $engine =="
            target/release/ounce-core fuzz-replay --engine "$engine" --show 10 "$trace" | tee "$RUNNER_TEMP/testfloat-$engine.txt"
            # fuzz-replay exits 1 on a value mismatch; flag mismatches are printed, so fail on those too
            grep -q 'differ on matching results: 0$' "$RUNNER_TEMP/testfloat-$engine.txt"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: testfloat-results
          path: |
            ${{ runner.temp }}/testfloat-*.txt
          if-no-files-found: warn
