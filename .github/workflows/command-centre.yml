name: Command centre

on:
  pull_request:
    paths:
      - 'tools/command-centre/**'
      - '.github/workflows/command-centre.yml'
  push:
    branches: [main]
    paths:
      - 'tools/command-centre/**'
      - '.github/workflows/command-centre.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install test-only dependencies
        run: npm ci --ignore-scripts
        working-directory: tools/command-centre
      - name: Run regression suite
        run: npm test
        working-directory: tools/command-centre
      - name: Check JavaScript syntax
        run: npm run check
        working-directory: tools/command-centre
