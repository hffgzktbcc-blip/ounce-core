name: CI infrastructure rerun

# When a CI run fails only because hosted-runner jobs were cancelled (for example a macOS runner that
# never started), re-run the failed jobs. A job that actually failed is never re-run: if any
# non-summary job has the conclusion "failure" or "timed_out", this does nothing. No repository code
# is checked out or executed here.
#
# At most two automatic re-runs:
# - after attempt 1, when every non-passing job was cancelled;
# - after attempt 2, only when every non-passing job was cancelled without ever reaching a runner (no
#   runner assigned, no steps). A job that never started cannot be hiding a real failure. A queued
#   macOS job can wait until GitHub cancels it, twice in a row: run 44144034971 lost
#   `Release notice packaging (macos-latest)` that way on attempts 1 and 2.
# workflow_run always runs this file as it is on the default branch, so edits apply after merge.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    # The attempt limit lives in the script, so scripts/test_ci_rerun_infra.py exercises the whole decision.
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Re-run when only cancelled jobs failed the run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          if [ "$RUN_ATTEMPT" -gt 2 ]; then
            echo "Attempt $RUN_ATTEMPT is past the automatic limit of two re-runs; a person decides from here."
            exit 0
          fi
          # If someone already re-ran it by hand, the attempt that just finished is not the run's state.
          current=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_attempt)
          if [ "$current" != "$RUN_ATTEMPT" ]; then
            echo "The run is already on attempt $current; leaving attempt $RUN_ATTEMPT alone."
            exit 0
          fi
          # Name, conclusion, and whether the job ever reached a runner.
          jobs=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | [.name, .conclusion,
              (if (.runner_id // 0) == 0 and ((.steps // []) | length) == 0 then "never-started" else "started" end)] | @tsv')
          # The "Test (...)" jobs only summarise the others, so ignore them when deciding.
          real=$(printf '%s\n' "$jobs" | awk -F'\t' '$1 !~ /^Test \(/ && $2 != "success" && $2 != "skipped" && $2 != ""')
          echo "Non-passing jobs other than the summaries (attempt $RUN_ATTEMPT):"
          printf '%s\n' "$real"
          if [ -z "$real" ]; then
            echo "Only summary jobs failed; nothing to re-run."
            exit 0
          fi
          if printf '%s\n' "$real" | awk -F'\t' '$2 != "cancelled" { bad = 1 } END { exit !bad }'; then
            echo "At least one job really failed; not re-running."
            exit 0
          fi
          if [ "$RUN_ATTEMPT" -gt 1 ] &&
            printf '%s\n' "$real" | awk -F'\t' '$3 != "never-started" { bad = 1 } END { exit !bad }'; then
            echo "A cancelled job had reached a runner; after attempt 1 only jobs that never started are re-run."
            exit 0
          fi
          echo "Only cancelled jobs; re-running the failed jobs (automatic re-run $RUN_ATTEMPT of 2)."
          gh run rerun "$RUN_ID" --repo "$REPO" --failed
