name: Diagnosis toolkit release

on:
  push:
    branches: ['release/diagnosis-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolkit:
    name: Toolkit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.9.25'
          - os: ubuntu-24.04
            python: '3.13.17'
          - os: macos-latest
            python: '3.13.17'
          - os: windows-latest
            python: '3.13.17'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test the standalone toolkit source
        run: python -B -m unittest discover -s scripts -p test_diagnosis_cli.py
      - name: Build the archive
        run: python -B scripts/build_diagnosis_cli.py --output dist/ounce-diagnose.pyz
      - name: Inspect both retained cases
        run: |
          python -I dist/ounce-diagnose.pyz --version
          python -I dist/ounce-diagnose.pyz example --output smoke-sdl2
          python -I dist/ounce-diagnose.pyz audio-case --output smoke-audio
      - uses: actions/upload-artifact@v4
        with:
          name: diagnosis-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            dist/
            smoke-sdl2/diagnosis.json
            smoke-audio/diagnosis.json
          if-no-files-found: error
