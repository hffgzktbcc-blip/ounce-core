name: Differential verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/verify/**'
      - 'scripts/verify_differential.py'
      - 'scripts/verify_linux_elf.py'
      - 'scripts/test_verify_linux_elf.py'
      - 'tests/linux-elf/**'
      - 'Cargo.*'
      - '.github/workflows/differential.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/verify/**'
      - 'scripts/verify_differential.py'
      - 'scripts/verify_linux_elf.py'
      - 'scripts/test_verify_linux_elf.py'
      - 'tests/linux-elf/**'
      - 'Cargo.*'
      - '.github/workflows/differential.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: differential-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-library:
    name: Static Linux ELF (${{ matrix.os }}, LZ4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev
      - name: Install portable C compiler
        run: python3 -m pip install ziglang==0.17.1
      - name: Build runtime with actual Tier-4 support
        run: cargo build --release --locked --features native-jit
      - name: Qualify clock and guest-argument behavior
        run: cargo test --release --locked --features native-jit --test cli_failures
      - name: Compare unchanged LZ4 cases on host and both ELF engines
        run: python3 scripts/verify_linux_elf.py --work target/linux-lz4 --host-cc 'python3 -m ziglang cc' --elf-cc 'python3 -m ziglang cc -target aarch64-linux-musl'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-elf-lz4-evidence-${{ matrix.os }}
          path: |
            target/linux-lz4/report.json
            target/linux-lz4/*.stdout
            target/linux-lz4/*.stderr
          if-no-files-found: warn

  instruction-fuzzer:
    name: Instruction fuzzer (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check seeded instructions against hardware and across engines
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p fuzz-results
          export TMPDIR="$PWD/fuzz-results"
          bash docs/verify/insn-fuzzer/run_tiers.sh 20000 2>&1 | tee fuzz-results/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instruction-fuzzer-apple-silicon
          path: fuzz-results/
          if-no-files-found: warn

  build-nros:
    name: Build differential NROs (devkitA64)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
      - name: Ensure git and python3
        run: |
          command -v git >/dev/null && command -v python3 >/dev/null || \
            (apt-get update && apt-get install -y --no-install-recommends git python3 ca-certificates)
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build every NRO
        run: python3 scripts/verify_differential.py --nro --build-only --nro-out nros
      - uses: actions/upload-artifact@v4
        with:
          name: differential-nros
          path: nros/*.nro
          if-no-files-found: error

  differential:
    name: Differential (${{ matrix.os }})
    needs: build-nros
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Build ounce-core
        run: cargo build --release --features "nce native-jit"
      - uses: actions/download-artifact@v4
        with:
          name: differential-nros
          path: nros
      - name: Run differential checks
        run: python3 scripts/verify_differential.py --nro-dir nros --json report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-report-${{ matrix.os }}
          path: report.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-outputs-${{ matrix.os }}
          path: |
            target/differential/*/host-output.txt
            target/differential/*/engine-*-results.txt
          if-no-files-found: warn
