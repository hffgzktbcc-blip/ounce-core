# Additional opt-in quality gates. Existing 9-job ci.yml remains unchanged.
name: Rust security checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'crates/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/rust-security.yml'
  schedule:
    # New RustSec advisories may arrive without a code change.
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-rust:
    name: CodeQL (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: codeql-rust
      - name: Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev
      - name: Initialize CodeQL Rust analysis
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: rust
      - name: Build Rust code for extraction
        run: cargo build --locked --release
      - name: Analyze code
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:rust

  cargo-deny:
    name: Cargo Deny (licenses, bans, advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check
          arguments: --all-features --locked
