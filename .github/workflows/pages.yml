name: Documentation website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'crates/ounce-learn/**'
      - 'tools/playground/**'
      - 'src/cpu/**'
      - 'src/mmu/**'
      - 'scripts/build_playground.sh'
      - 'scripts/package_playground_notices.py'
      - 'scripts/collect_toolchain_notices.py'
      - 'LICENSE'
      - 'THIRD_PARTY.md'
      - 'THIRD_PARTY_NOTICES.txt'
      - 'assets/ounce-core-vista.png'
      - 'docs/media/ounce-core-main.mp4'
      - 'docs/media/ounce-core-poster.jpg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static documentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry_2.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rust-docs
      - name: Install pinned WebAssembly binding tool
        run: |
          curl -fsSL https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz -o bindgen.tar.gz
          echo '82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  bindgen.tar.gz' | sha256sum --check
          tar -xzf bindgen.tar.gz
          echo "$PWD/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Build and check the actual browser interpreter
        run: |
          scripts/build_playground.sh
          python3 tools/playground/check_artifact.py target/playground
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Assemble site
        shell: bash
        run: |
          mkdir -p site/assets
          cp assets/ounce-core-vista.png site/assets/ounce-core-vista.png
          cp docs/media/ounce-core-main.mp4 docs/media/ounce-core-poster.jpg site/assets/
          cp -R target/playground site/playground
      - name: Upload website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      # deploy-pages sometimes reports "Found 0 artifact(s)" right after a successful upload, because
      # the artifact is not yet visible to the Pages API. Retry the deploy at most twice, with a pause
      # before each retry. The concurrency group above already serialises deploys.
      - name: Deploy website
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Wait before deploy retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy website (retry 1)
        id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Wait before deploy retry 2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        run: sleep 60
      - name: Deploy website (retry 2)
        id: deployment_retry_2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
