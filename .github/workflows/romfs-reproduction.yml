name: Published RomFS recipe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/romfs-reproduction.yml'
      - 'docs/REPRODUCE_ROMFS.md'
      - 'docs/reproduce/romfs.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-recipe:
    # This is internal qualification, never an unaffiliated reproduction.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install documented host prerequisites
        run: |
          test "$(uname -m)" = x86_64
          test "$(docker info --format '{{.Architecture}}')" = x86_64
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - name: Execute every published Bash block in one shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          guide = Path('docs/REPRODUCE_ROMFS.md').read_text()
          blocks = re.findall(r'```bash\n(.*?)```', guide, re.S)
          assert len(blocks) == 4, 'review changes to the published recipe sections'
          target = Path(os.environ['RUNNER_TEMP']) / 'romfs-recipe.sh'
          target.write_text('\n'.join(blocks))
          PY
          mkdir -p "$RUNNER_TEMP/romfs-qualification"
          cd "$RUNNER_TEMP/romfs-qualification"
          bash "$RUNNER_TEMP/romfs-recipe.sh" 2>&1 | tee recipe.log

      - name: Retain sanitized text evidence, including failures
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, platform
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'romfs-qualification'
          public = Path(os.environ['RUNNER_TEMP']) / 'romfs-public-evidence'
          public.mkdir()
          replacements = [(str(root), '$QUALIFICATION_ROOT')]
          replacements += [(os.environ[k], '$' + k) for k in
                           ('GITHUB_WORKSPACE', 'RUNNER_TEMP', 'HOME') if os.environ.get(k)]
          files = [root / 'recipe.log']
          for experiment in root.glob('romfs-repro.*'):
              files += list((experiment / 'evidence').glob('*'))
              inventory = experiment / 'builds/original/build/inventory.json'
              files.append(inventory)
          for source in files:
              if not source.is_file() or source.suffix not in {'.log', '.json', '.jsonl', '.txt', '.sha256'}:
                  continue
              text = source.read_text()
              for old, new in replacements:
                  text = text.replace(old, new)
              (public / source.name).write_text(text)
          (public / 'qualification.json').write_text(json.dumps({
              'scope': 'internal GitHub-hosted Linux amd64 recipe qualification; not independent',
              'machine': platform.machine(), 'system': platform.system(),
              'workflow_commit': os.environ['GITHUB_SHA'],
              'run_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY']
                         + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
          }, indent=2) + '\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: romfs-published-recipe-text
          path: ${{ runner.temp }}/romfs-public-evidence/
          if-no-files-found: error
          retention-days: 30
