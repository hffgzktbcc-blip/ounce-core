name: Refresh roadmap from GitHub evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * *'
  push:
    branches: [main]
    paths:
      - 'docs/roadmap/milestones.json'
      - 'scripts/render_roadmap.py'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: roadmap-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Only API-observed PR state updates automatically. Never promote research
      # stages based solely on a merge, CI green, a screenshot or a comment.
      - name: Refresh PR observations and render roadmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/render_roadmap.py --sync-prs
      - name: Validate registry and rendered README
        run: |
          python3 -m unittest scripts/test_readme_roadmap.py
          python3 scripts/render_roadmap.py --check
      - name: Open a single reviewable update only if data changed
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            docs/roadmap/milestones.json
            README.md
          branch: automation/roadmap-refresh
          delete-branch: true
          title: 'docs: refresh live roadmap observations'
          commit-message: 'docs: refresh GitHub PR observations and generated roadmap'
          body: |
            Automated observations only; no evidence-based milestone stage is
            promoted by this job. Check canonical corpus evidence separately.
            Generated by scripts/render_roadmap.py from docs/roadmap/milestones.json.
          labels: documentation
