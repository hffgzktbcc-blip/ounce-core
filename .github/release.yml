# Used by `gh release create --generate-notes` and GitHub's "Generate release notes" button.
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
  categories:
    - title: New verified programs
      labels:
        - program
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies and CI
      labels:
        - dependencies
        - github_actions
    - title: Other changes
      labels:
        - "*"
