[package]
name = "ounce-core"
version = "0.5.0"
edition = "2024"
description = "Homebrew systems research runtime and architecture compatibility layer for NVIDIA Tegra T239"

[workspace]
members = [".", "crates/ounce-recompiler", "crates/ounce-nce"]
# `cargo test` / `cargo run` at the root keep targeting ounce-core only.
default-members = ["."]

[features]
default = []
# Tier-4 native recompiler (M4, docs/design/m4-native-jit.md). Off by default.
native-jit = ["dep:ounce-recompiler"]
# Host GPU presentation (Vulkan on Linux/Windows, Metal on macOS) via wgpu.
gpu-present = ["dep:wgpu", "dep:winit", "dep:pollster"]
# Native execution on AArch64 hosts (`--cpu=native`, PLAN.md step 4). Off by default.
nce = ["dep:ounce-nce"]

[dependencies]
ab_glyph = "0.2"
byteorder = "1.5.0"
cpal = "0.18.2"
gilrs = "0.11.2"
minifb = "0.29.0"
ounce-nce = { path = "crates/ounce-nce", optional = true }
ounce-recompiler = { path = "crates/ounce-recompiler", optional = true }
pollster = { version = "1.0", optional = true }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0.21"
wgpu = { version = "30.0.1", optional = true }
winit = { version = "0.30", optional = true }

[dev-dependencies]
# Validates the WGSL emitted by src/gpu/sass in tests. Same version wgpu 30 pulls in.
naga = { version = "30.0.1", features = ["wgsl-in"] }
