<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0e1522"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="45%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#9B51E0"/>
    </linearGradient>

    <!-- Core Emerald / Cyan Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>

    <!-- Metal Gradient -->
    <linearGradient id="metalRing" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2a364a"/>
      <stop offset="50%" stop-color="#182130"/>
      <stop offset="100%" stop-color="#0f1520"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="amb"/>
    </filter>
  </defs>

  <!-- Banner Outer Border Canvas -->
  <rect width="1200" height="340" rx="20" fill="url(#bgGrad)"/>
  <rect width="1196" height="336" x="2" y="2" rx="18" fill="none" stroke="#1c283a" stroke-width="2"/>

  <!-- Subtle Ambient Glow Behind Left Emblem -->
  <circle cx="210" cy="170" r="140" fill="#00D2FF" opacity="0.10" filter="url(#ambientGlow)"/>

  <!-- Subtle Circuit Lattice Network -->
  <g stroke="#00D2FF" stroke-width="1.2" opacity="0.14" fill="none">
    <path d="M 50 170 L 120 170 L 150 140 M 270 200 L 300 170 L 420 170"/>
    <path d="M 210 50 L 210 110 M 210 230 L 210 290"/>
    <path d="M 420 170 L 460 210 L 600 210 M 800 70 L 850 120 L 1150 120"/>
    <path d="M 900 280 L 960 220 L 1150 220"/>
    <circle cx="50" cy="170" r="3" fill="#00D2FF"/>
    <circle cx="420" cy="170" r="3" fill="#00D2FF"/>
    <circle cx="600" cy="210" r="3" fill="#00FFA3"/>
    <circle cx="1150" cy="120" r="3" fill="#00D2FF"/>
    <circle cx="1150" cy="220" r="3" fill="#00FFA3"/>
  </g>

  <!-- ==================== LEFT LOGO EMBLEM (Scaled) ==================== -->
  <g transform="translate(100, 60) scale(0.43)">
    <!-- Outer Octagonal Shield -->
    <polygon points="256,76 384,128 436,256 384,384 256,436 128,384 76,256 128,128" 
             fill="url(#metalRing)" 
             stroke="#2d3d54" 
             stroke-width="6"/>

    <!-- Glowing Hexagonal Core Outer Loop -->
    <polygon points="256,116 356,156 396,256 356,356 256,396 156,356 116,256 156,156" 
             fill="none" 
             stroke="url(#coreGrad)" 
             stroke-width="14" 
             stroke-linejoin="round"
             filter="url(#neonGlow)"/>

    <!-- Inner Processor Cavity -->
    <circle cx="256" cy="256" r="76" fill="#090d14" stroke="#1f2c3f" stroke-width="4"/>

    <!-- 8 ARM Cortex-A78C Micro-Nodes -->
    <g fill="#00FFA3" filter="url(#neonGlow)">
      <circle cx="256" cy="180" r="7"/>
      <circle cx="310" cy="202" r="7"/>
      <circle cx="332" cy="256" r="7"/>
      <circle cx="310" cy="310" r="7"/>
      <circle cx="256" cy="332" r="7"/>
      <circle cx="202" cy="310" r="7"/>
      <circle cx="180" cy="256" r="7"/>
      <circle cx="202" cy="202" r="7"/>
    </g>

    <!-- Central Diamond Core -->
    <polygon points="256,212 292,256 256,300 220,256" 
             fill="url(#coreGrad)" 
             filter="url(#neonGlow)"/>
    <polygon points="256,226 280,256 256,286 232,256" fill="#0b0f17"/>
    <circle cx="256" cy="256" r="5" fill="#00FFA3" filter="url(#neonGlow)"/>
  </g>

  <!-- ==================== TYPOGRAPHY & HEADER ==================== -->
  <!-- Project Title -->
  <text x="350" y="125" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif" 
        font-size="62" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#FFFFFF">
    OUNCE<tspan fill="url(#accentGrad)">·CORE</tspan>
  </text>

  <!-- Tagline / Subtitle -->
  <text x="352" y="166" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="18" 
        font-weight="500" 
        letter-spacing="1.2" 
        fill="#8fa0bc">
    Hardware Research Runtime &amp; Architecture Compatibility Layer
  </text>

  <!-- Thin Gradient Divider -->
  <rect x="352" y="190" width="760" height="2" fill="url(#accentGrad)" opacity="0.6"/>

  <!-- Technical Spec Pills / Tags -->
  <g transform="translate(352, 212)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">
    <!-- Tag 1: Target SoC -->
    <g transform="translate(0, 0)">
      <rect width="170" height="30" rx="8" fill="#141c2b" stroke="#25354e" stroke-width="1.2"/>
      <circle cx="14" cy="15" r="4" fill="#76B900"/>
      <text x="26" y="19" fill="#d0dcf0">TEGRA T239 (DRAKE)</text>
    </g>

    <!-- Tag 2: CPU Cores -->
    <g transform="translate(182, 0)">
      <rect width="180" height="30" rx="8" fill="#141c2b" stroke="#25354e" stroke-width="1.2"/>
      <circle cx="14" cy="15" r="4" fill="#00D2FF"/>
      <text x="26" y="19" fill="#d0dcf0">8× CORTEX-A78C (PAC/BTI)</text>
    </g>

    <!-- Tag 3: GPU Architecture -->
    <g transform="translate(374, 0)">
      <rect width="170" height="30" rx="8" fill="#141c2b" stroke="#25354e" stroke-width="1.2"/>
      <circle cx="14" cy="15" r="4" fill="#00FFA3"/>
      <text x="26" y="19" fill="#d0dcf0">NVN / 2× SCALER (NOT DLSS)</text>
    </g>

    <!-- Tag 4: Implementation -->
    <g transform="translate(556, 0)">
      <rect width="170" height="30" rx="8" fill="#141c2b" stroke="#25354e" stroke-width="1.2"/>
      <circle cx="14" cy="15" r="4" fill="#9B51E0"/>
      <text x="26" y="19" fill="#d0dcf0">PURE SAFE RUST 2024</text>
    </g>
  </g>

  <!-- Bottom Metadata Line -->
  <text x="354" y="278" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="13" 
        fill="#5a6d88" 
        letter-spacing="0.5">
    Horizon-style ABI · No keys, firmware or game data distributed
  </text>
</svg>
