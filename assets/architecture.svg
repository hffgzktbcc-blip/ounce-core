<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="diagramBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="50%" stop-color="#0b101a"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>

    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#9B51E0"/>
    </linearGradient>

    <!-- Glow & Shadow -->
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="600" rx="16" fill="url(#diagramBg)"/>
  <rect width="1196" height="596" x="2" y="2" rx="14" fill="none" stroke="#162030" stroke-width="2"/>

  <!-- Subtle Circuit Lattice Network -->
  <g stroke="#00D2FF" stroke-width="1" opacity="0.08" fill="none">
    <path d="M 40 100 L 200 100 L 240 60 M 1000 60 L 1040 100 L 1160 100"/>
    <path d="M 40 500 L 200 500 L 240 540 M 1000 540 L 1040 500 L 1160 500"/>
    <circle cx="40" cy="100" r="3" fill="#00D2FF"/>
    <circle cx="1160" cy="100" r="3" fill="#00D2FF"/>
  </g>

  <!-- ==================== TOP: PACKAGE & ASSET INGESTION ==================== -->
  <g transform="translate(40, 25)" filter="url(#cardShadow)">
    <rect width="1120" height="90" rx="12" fill="url(#cardBg)" stroke="#1e2c3e" stroke-width="1.5"/>
    <!-- Header Pill -->
    <rect x="20" y="14" width="190" height="22" rx="6" fill="#152438" stroke="#2a4060" stroke-width="1"/>
    <circle cx="32" cy="25" r="4" fill="#00FFA3" filter="url(#neon)"/>
    <text x="44" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00FFA3" letter-spacing="1">CONTAINER &amp; ASSET PIPELINE</text>

    <!-- Sub-Nodes -->
    <g transform="translate(20, 46)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">
      <!-- Node 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="32" rx="6" fill="#0c121c" stroke="#223348" stroke-width="1"/>
        <text x="12" y="20" fill="#e0e8f5">64GB GameCard (.xci)</text>
      </g>
      <!-- Arrow -->
      <path d="M 175 16 L 195 16" stroke="#00D2FF" stroke-width="1.5" stroke-dasharray="3,3"/>
      <!-- Node 2 -->
      <g transform="translate(205, 0)">
        <rect width="145" height="32" rx="6" fill="#0c121c" stroke="#223348" stroke-width="1"/>
        <text x="12" y="20" fill="#e0e8f5">HFS0 / PFS0 Partition</text>
      </g>
      <!-- Arrow -->
      <path d="M 360 16 L 380 16" stroke="#00D2FF" stroke-width="1.5" stroke-dasharray="3,3"/>
      <!-- Node 3 -->
      <g transform="translate(390, 0)">
        <rect width="195" height="32" rx="6" fill="#0c121c" stroke="#223348" stroke-width="1"/>
        <text x="12" y="20" fill="#00FFA3">NCA3 (AES-128-CTR)</text>
      </g>
      <!-- Fork Arrows -->
      <path d="M 595 16 L 625 16" stroke="#00D2FF" stroke-width="1.5"/>
      <!-- Node 4: ExeFS -->
      <g transform="translate(635, 0)">
        <rect width="210" height="32" rx="6" fill="#0c121c" stroke="#223348" stroke-width="1"/>
        <text x="12" y="20" fill="#e0e8f5">ExeFS / NSO0 (AArch64)</text>
      </g>
      <!-- Node 5: RomFS -->
      <g transform="translate(860, 0)">
        <rect width="210" height="32" rx="6" fill="#0c121c" stroke="#223348" stroke-width="1"/>
        <text x="12" y="20" fill="#e0e8f5">Level 3 RomFS Hash Tables</text>
      </g>
    </g>
  </g>

  <!-- Flow Arrows from Ingestion to CPU & MMU -->
  <path d="M 300 115 L 300 145" stroke="#00FFA3" stroke-width="2" stroke-linecap="round"/>
  <path d="M 900 115 L 900 145" stroke="#00D2FF" stroke-width="2" stroke-linecap="round"/>

  <!-- ==================== MIDDLE ROW: CPU COMPLEX & GPU COMPLEX ==================== -->
  
  <!-- LEFT: CPU Complex (8x Cortex-A78C) -->
  <g transform="translate(40, 145)" filter="url(#cardShadow)">
    <rect width="545" height="235" rx="12" fill="url(#cardBg)" stroke="#1e2c3e" stroke-width="1.5"/>
    
    <!-- Title Pill -->
    <rect x="20" y="16" width="250" height="24" rx="6" fill="#152438" stroke="#2a4060" stroke-width="1"/>
    <circle cx="34" cy="28" r="4" fill="#00D2FF" filter="url(#neon)"/>
    <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00D2FF" letter-spacing="1">CPU CLUSTER (8× CORTEX-A78C)</text>

    <!-- Sub-Boxes: 8 Core Grid -->
    <g transform="translate(20, 52)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">
      <!-- 8 Cores (2 rows of 4) -->
      <g fill="#0c121c" stroke="#25354a" stroke-width="1">
        <rect x="0" y="0" width="118" height="36" rx="6"/><text x="10" y="22" fill="#d0dcf0">Core 0 (Thread 0)</text>
        <rect x="128" y="0" width="118" height="36" rx="6"/><text x="138" y="22" fill="#d0dcf0">Core 1 (Worker)</text>
        <rect x="256" y="0" width="118" height="36" rx="6"/><text x="266" y="22" fill="#d0dcf0">Core 2 (Worker)</text>
        <rect x="384" y="0" width="118" height="36" rx="6"/><text x="394" y="22" fill="#d0dcf0">Core 3 (Worker)</text>

        <rect x="0" y="44" width="118" height="36" rx="6"/><text x="10" y="66" fill="#d0dcf0">Core 4 (Audio)</text>
        <rect x="128" y="44" width="118" height="36" rx="6"/><text x="138" y="66" fill="#d0dcf0">Core 5 (Worker)</text>
        <rect x="256" y="44" width="118" height="36" rx="6"/><text x="266" y="66" fill="#d0dcf0">Core 6 (Worker)</text>
        <rect x="384" y="44" width="118" height="36" rx="6"/><text x="394" y="66" fill="#d0dcf0">Core 7 (System)</text>
      </g>

      <!-- Security & JIT Layer -->
      <g transform="translate(0, 92)">
        <rect width="248" height="42" rx="6" fill="#0e1724" stroke="#1f334d" stroke-width="1"/>
        <text x="12" y="20" fill="#00FFA3" font-weight="700">ARMv8.3/v8.5-A Security</text>
        <text x="12" y="34" fill="#8fa0bc" font-size="9">PAC (PACIBSP/AUTIBSP) + BTI Guard</text>

        <rect x="256" y="0" width="246" height="42" rx="6" fill="#0e1724" stroke="#1f334d" stroke-width="1"/>
        <text x="268" y="20" fill="#00D2FF" font-weight="700">Dual-Tier JIT Execution</text>
        <text x="268" y="34" fill="#8fa0bc" font-size="9">Tier-1 Basic-Block + Tier-2 Chained JIT</text>
      </g>

      <!-- Preemptive Scheduler Banner -->
      <g transform="translate(0, 144)">
        <rect width="502" height="26" rx="6" fill="#141c2a" stroke="#23344a" stroke-width="1"/>
        <text x="14" y="17" fill="#7fa0cc" font-size="10">Preemptive Priority Scheduler · Mutex &amp; Futex Arbitration · SMP Affinity</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: GPU Complex (NVIDIA Ampere GA10B) -->
  <g transform="translate(615, 145)" filter="url(#cardShadow)">
    <rect width="545" height="235" rx="12" fill="url(#cardBg)" stroke="#1e2c3e" stroke-width="1.5"/>
    
    <!-- Title Pill -->
    <rect x="20" y="16" width="250" height="24" rx="6" fill="#152438" stroke="#2a4060" stroke-width="1"/>
    <circle cx="34" cy="28" r="4" fill="#76B900" filter="url(#neon)"/>
    <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#76B900" letter-spacing="1">GPU CLUSTER (AMPERE GA10B)</text>

    <!-- Sub-Boxes: GPU Subsystems -->
    <g transform="translate(20, 52)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">
      <!-- Row 1: NVN & Pushbuffer -->
      <g transform="translate(0, 0)">
        <rect width="246" height="38" rx="6" fill="#0c121c" stroke="#25354a" stroke-width="1"/>
        <text x="12" y="18" fill="#e0e8f5">Switch 2 NVN Driver HLE</text>
        <text x="12" y="31" fill="#7fa0cc" font-size="9">svcNvnSubmitCommandBuffer (0x2D)</text>

        <rect x="256" y="0" width="246" height="38" rx="6" fill="#0c121c" stroke="#25354a" stroke-width="1"/>
        <text x="268" y="18" fill="#e0e8f5">GPFIFO Channel Methods</text>
        <text x="268" y="31" fill="#7fa0cc" font-size="9">Pushbuffers 0x100..0x10A, Texture Op 0x0B</text>
      </g>

      <!-- Row 2: SASS Transpiler & Upscaler -->
      <g transform="translate(0, 48)">
        <rect width="246" height="42" rx="6" fill="#0e1724" stroke="#1f334d" stroke-width="1"/>
        <text x="12" y="20" fill="#00FFA3" font-weight="700">Ampere SASS Transpiler</text>
        <text x="12" y="34" fill="#8fa0bc" font-size="9">SM87 SASS -> Vulkan SPIR-V 1.5 Bytecode</text>

        <rect x="256" y="0" width="246" height="42" rx="6" fill="#0e1724" stroke="#1f334d" stroke-width="1"/>
        <text x="268" y="20" fill="#00D2FF" font-weight="700">2× Upscaler (not DLSS)</text>
        <text x="268" y="34" fill="#8fa0bc" font-size="9">AI Super-Resolution Frame Reconstruction</text>
      </g>

      <!-- Row 3: Rasterizer & Memory Pools -->
      <g transform="translate(0, 100)">
        <rect width="502" height="36" rx="6" fill="#141c2a" stroke="#23344a" stroke-width="1"/>
        <text x="14" y="17" fill="#e0e8f5">Hardware Graphics HAL: Vulkan 1.3 / Metal PSO Pipeline</text>
        <text x="14" y="29" fill="#7fa0cc" font-size="9">Double-Buffered RGBA8888 VRAM · Z-Buffer Occlusion · UV Texture Mapping</text>
      </g>
    </g>
  </g>

  <!-- ==================== CENTRAL BUS: HIGH-SPEED INTERCONNECT ==================== -->
  <g transform="translate(40, 395)">
    <rect width="1120" height="28" rx="8" fill="#0a101a" stroke="url(#busGrad)" stroke-width="2"/>
    <text x="560" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#00FFA3" text-anchor="middle" letter-spacing="2">
      12 GB LPDDR5X HIGH-SPEED UNIFIED MEMORY BUS (~102.4 GB/s · 128-BIT @ 6400 MT/s)
    </text>
  </g>

  <!-- ==================== BOTTOM ROW: HORIZON KERNEL & PERIPHERALS ==================== -->
  <g transform="translate(40, 440)" filter="url(#cardShadow)">
    <rect width="1120" height="135" rx="12" fill="url(#cardBg)" stroke="#1e2c3e" stroke-width="1.5"/>

    <!-- Title Pill -->
    <rect x="20" y="16" width="310" height="24" rx="6" fill="#152438" stroke="#2a4060" stroke-width="1"/>
    <circle cx="34" cy="28" r="4" fill="#9B51E0" filter="url(#neon)"/>
    <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="1">HORIZON OS 64-BIT MICROKERNEL (FW 23.0.1)</text>

    <!-- 5 Service Clusters -->
    <g transform="translate(20, 52)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">
      <!-- Srv 1: IPC Protocols -->
      <g transform="translate(0, 0)">
        <rect width="205" height="66" rx="6" fill="#0c121c" stroke="#223348" stroke-width="1"/>
        <text x="12" y="20" fill="#00FFA3">TIPC &amp; CMIF Dispatch</text>
        <text x="12" y="36" fill="#8fa0bc" font-size="9">sm: Tipc (0x10 / 0x12)</text>
        <text x="12" y="52" fill="#8fa0bc" font-size="9">CMIF SFCI / SFCO In/Out</text>
      </g>

      <!-- Srv 2: Big 5 System Services -->
      <g transform="translate(217, 0)">
        <rect width="260" height="66" rx="6" fill="#0c121c" stroke="#223348" stroke-width="1"/>
        <text x="12" y="20" fill="#00D2FF">Horizon Big 5 Services</text>
        <text x="12" y="36" fill="#8fa0bc" font-size="9">set:sys (FW 23.0.1) · vi:m Display</text>
        <text x="12" y="52" fill="#8fa0bc" font-size="9">am:appletOE (Focus) · fsp-srv</text>
      </g>

      <!-- Srv 3: Dynamic Linker ro:1 -->
      <g transform="translate(489, 0)">
        <rect width="200" height="66" rx="6" fill="#0c121c" stroke="#223348" stroke-width="1"/>
        <text x="12" y="20" fill="#c084fc">Dynamic Linker (ro:1)</text>
        <text x="12" y="36" fill="#8fa0bc" font-size="9">LoadNro / UnloadNro ABI</text>
        <text x="12" y="52" fill="#8fa0bc" font-size="9">MOD0 Relocation Engine</text>
      </g>

      <!-- Srv 4: audren DSP Audio -->
      <g transform="translate(701, 0)">
        <rect width="185" height="66" rx="6" fill="#0c121c" stroke="#223348" stroke-width="1"/>
        <text x="12" y="20" fill="#00FFA3">audren:u Audio DSP</text>
        <text x="12" y="36" fill="#8fa0bc" font-size="9">Multi-Voice Mixing Matrix</text>
        <text x="12" y="52" fill="#8fa0bc" font-size="9">audout:u 48kHz Stereo PCM</text>
      </g>

      <!-- Srv 5: Joy-Con 2 Input -->
      <g transform="translate(898, 0)">
        <rect width="180" height="66" rx="6" fill="#0c121c" stroke="#223348" stroke-width="1"/>
        <text x="12" y="20" fill="#00D2FF">Joy-Con 2 Input (hid)</text>
        <text x="12" y="36" fill="#8fa0bc" font-size="9">SharedMem Handle 0x200</text>
        <text x="12" y="52" fill="#8fa0bc" font-size="9">Radial Deadzone Filtering</text>
      </g>
    </g>
  </g>
</svg>
