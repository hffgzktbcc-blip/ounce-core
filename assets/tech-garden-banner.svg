<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
<title id="t">Ounce Core — A garden for systems research</title>
<desc id="d">An atmospheric midnight botanical garden where luminous circuit branches and small wildflowers surround a processor-shaped sun. Ounce Core wordmark and research runtime subtitle.</desc>
<defs>
