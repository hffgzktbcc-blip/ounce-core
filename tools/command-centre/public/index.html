<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#142a25" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Ounce Family — Command Centre</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="connectionGate" class="login-gate">
    <div class="login-card"><img src="/icon.svg" alt="Ounce" class="login-logo"><h1>Connecting to Oracle</h1><p id="connectionMessage" role="status">Checking your saved session…</p><button id="retryConnectionBtn" class="btn btn-primary hidden">Retry connection</button></div>
  </div>
  <!-- Login Gate -->
  <div id="loginGate" class="login-gate hidden">
    <form id="loginForm" class="login-card">
      <img src="/icon.svg" alt="Ounce" class="login-logo" />
      <h1>Ounce Command Centre</h1>
      <p>Your projects, priorities and agent runs.</p>
      <label for="pinInput" class="sr-only">Command Centre passcode</label>
      <input id="pinInput" type="password" placeholder="Enter Command Passcode" autocomplete="current-password" required />
      <button type="submit" class="btn btn-primary" style="width:100%;">Unlock Command Centre</button>
      <div id="loginError" class="login-error" role="alert"></div>
    </form>
  </div>

  <!-- Main App Shell -->
  <div id="appShell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/icon.svg" alt="Ounce" />
        <div>
          <strong>OUNCE FAMILY</strong>
          <span>Oracle + Orca Control</span>
        </div>
      </div>

      <nav aria-label="Main navigation" class="side-nav">
        <button class="side-link" data-tab="home">Home</button>
        <button class="side-link" data-tab="queue"><span>Queue</span><span id="sideQueueCount" class="pill">0</span></button>
        <button class="side-link" data-tab="roadmap">Plan</button>
        <button class="side-link" data-tab="bots">Agents</button>
      </nav>
      <div class="nav-section">Tools &amp; evidence</div>
      <button class="side-link" data-tab="infra">Infrastructure</button>
      <button class="side-link" data-tab="github">GitHub</button>
      <button class="side-link" data-tab="claims">Evidence &amp; claims</button>
      <button class="side-link" data-tab="releases">Release gates</button>
      <button class="side-link" data-tab="decisions">Decisions</button>

      <div class="sidebar-footer">
        <button id="sideAddBtn" class="btn btn-primary" style="width:100%;margin-bottom:8px;">+ Add item</button>
        <button id="sideLogoutBtn" class="btn btn-sm" style="width:100%;">Lock / Sign out</button>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-title">
          <img src="/icon.svg" alt="Ounce" />
          <div>
            <h2 id="pageTitle">Home</h2>
            <div id="pageSub" class="topbar-sub">Ounce Family · Private</div>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="addItemTopBtn" class="btn btn-primary btn-sm">+ Add</button>
          <button id="refreshAllBtn" class="btn btn-sm" title="Refresh all" aria-label="Refresh data">↻</button>
        </div>
      </header>

      <div id="syncStatus" class="sync-status" role="status" aria-live="polite"></div>
      <main id="viewContainer" class="content" tabindex="-1"></main>
    </div>

    <nav class="mobile-nav" aria-label="Main navigation">
      <button class="nav-btn" data-tab="home"><span class="ico" aria-hidden="true">⌂</span><span>Home</span></button>
      <button class="nav-btn" data-tab="queue"><span class="ico" aria-hidden="true">☷</span><span>Queue</span></button>
      <button class="nav-btn" data-tab="roadmap"><span class="ico" aria-hidden="true">◇</span><span>Plan</span></button>
      <button class="nav-btn" data-tab="bots"><span class="ico" aria-hidden="true">✧</span><span>Agents</span></button>
      <button class="nav-btn" id="moreNavBtn"><span class="ico" aria-hidden="true">☰</span><span>More</span></button>
    </nav>
  </div>

  <!-- Modal Container -->
  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div id="modalSheet" class="modal-sheet" role="dialog" aria-modal="true" aria-label="Command Centre dialog" tabindex="-1"></div>
  </div>

  <div id="notice" class="notice hidden" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
