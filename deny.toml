# cargo-deny configuration for ounce-core (MIT)
# See docs/roadmap/OUNCE_FAMILY_1_YEAR_ROADMAP.md (Q1 pre-release gate)

[advisories]
ignore = [
    # Unmaintained advisory on ttf-parser 0.25.1 via ab_glyph -> owned_ttf_parser; no safe upgrade available.
    "RUSTSEC-2026-0192",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
