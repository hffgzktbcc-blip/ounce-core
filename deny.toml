# cargo-deny configuration for ounce-core (MIT)

[advisories]
# No ignores. RUSTSEC-2026-0192 (ttf-parser is unmaintained, reached through ab_glyph -> owned_ttf_parser) is
# not reported while `unmaintained` keeps its default scope of workspace dependencies only. If that scope is
# widened to "all", this advisory has to be ignored again, as no patched version exists.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
]
# BSD-2-Clause and BSD-3-Clause are only needed by the optional `gpu-present` feature (arrayref, tiny-skia),
# which CI builds but this check does not include. Do not warn about them in the default feature set.
unused-allowed-license = "allow"
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
